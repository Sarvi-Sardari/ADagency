# configs/metrics_configs.yaml
#
# Standalone metrics stage. Run any time with:
#   python run_metrics.py
#   python run_metrics.py --combine --include-rerun
#   python run_metrics.py --combine --base-results
#
# Prediction-source precedence:
#   --include-rerun  overrides every datasets[].include_rerun value to true.
#   --base-results   overrides every datasets[].include_rerun value to false.
#   neither flag     preserves the per-dataset values configured below.
# The two flags are mutually exclusive.
#
# This reads ONLY files already written under <run_dir>/<dataset_name>/ by a
# previous run_anomaly_detection.py run (all_data_summary.jsonl) and,
# optionally, a previous rerun.py run. No VLM/CLIP is loaded, so this is
# cheap and safe to re-run as often as you like — e.g. to compare "before
# rerun" vs "after rerun" metrics, just flip include_rerun and run this
# script again. A timestamped CSV is written each run (never overwritten):
# <run_dir>/<dataset_name>/<output.subdir>/metrics_<timestamp>.csv, or
# metrics_w_rerun_<timestamp>.csv when include_rerun is true.
#
# Each anomaly class present in the run (every test/ subfolder other than
# "good", e.g. "logical_anomalies"/"structural_anomalies") gets its own row
# with accuracy/F1/confusion-matrix/image-AUROC; an "overall" row is added
# automatically when a dataset has more than one anomaly class.

run_dir: "outputs/runs_mvtec_loco_v2_final/2026-09-10 18-08-20_ablation_001"   # same folder as anomaly_detection_configs.yaml's output.root_dir/output.runs_dir

# datasets: (Format)
#   - name:            Dataset name (must match a folder under run_dir, i.e. the dataset's `name` in anomaly_detection_configs.yaml)
#     include_rerun:    When true, predictions/scores are overridden per-image from
#                       <run_dir>/<dataset>/rerun_results/rerun_result.jsonl wherever a
#                       matching (label_folder, source_label_folder, img_name)
#                       entry exists (rerun.py writes
#                       one entry per image, whether or not it actually qualified for
#                       rerun, so this always safely applies to the full dataset).
#     root_dir:         OPTIONAL. Path to the ORIGINAL dataset root. Pixel metrics
#                       auto-detect either <root_dir>/ground_truth (label-nested or
#                       flat) or <root_dir>/mask_all (all masks in one folder).
#     ground_truth_dir: OPTIONAL override pointing directly to the mask directory.
#                       Use this for any other layout or folder name. It may be used
#                       with or without root_dir.
#                       Pixel AUROC/AUPRO are computed only when ground truth resolves AND
#                       <run_dir>/<dataset>/masks/ exists. masks/ should contain one
#                       subfolder per mask-generation method actually run for this
#                       dataset (e.g. masks/sam3, masks/bounding_box, masks/xai) —
#                       the CSV gets a "Pixel AUROC (<method>)" / "AUPRO (<method>)"
#                       column pair per subfolder found, so this is fully dynamic.
datasets:
  - name: "breakfast_box"
    include_rerun: true
    root_dir: "datasets/mvtec_loco/breakfast_box"
  - name: "juice_bottle"
    include_rerun: true
    root_dir: "datasets/mvtec_loco/juice_bottle"
  - name: "pushpins"
    include_rerun: true
    root_dir: "datasets/mvtec_loco/pushpins"
  - name: "screw_bag"
    include_rerun: true
    root_dir: "datasets/mvtec_loco/screw_bag"
  - name: "splicing_connectors"
    include_rerun: true
    root_dir: "datasets/mvtec_loco/splicing_connectors"
    
output:
  # Metrics CSVs are written to <run_dir>/<dataset_name>/<subdir>/ so that
  # re-running metrics never overwrites the run's own preproc/texts/*.jsonl
  # files.
  subdir: "metrics"
